<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0b0c"><title>Admin sign in | Tensie GT"><style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0c;color:#fff;font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(100%,440px);background:#171719;border:1px solid #333;padding:32px}.brand{font-weight:900;letter-spacing:.2em;color:#fff;text-decoration:none}.tag{color:#ff5366;font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;margin-top:34px}h1{font-size:32px;margin:8px 0}p{color:#bbb}label{display:block;margin:18px 0 6px;font-size:13px;font-weight:700}input{width:100%;padding:14px;background:#0d0d0e;border:1px solid #555;color:#fff;font:inherit}button{width:100%;padding:15px;margin-top:22px;background:#d6001c;color:white;border:0;font-weight:800;text-transform:uppercase;letter-spacing:.08em}#status{min-height:24px;margin-top:14px;color:#ff9ba7;font-size:14px}.back{display:block;margin-top:22px;color:#bbb;font-size:13px}
</style></head><body><main class="card"><a class="brand" href="/">TENSIE GT</a><div class="tag">Restricted area · Administrator</div><h1>Admin sign in</h1><p>This portal is only for authorised Tensie GT administrators. Customer accounts cannot access it.</p><form id="form"><label for="email">Admin email</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button id="submit">Sign in securely</button></form><div id="status" role="status" aria-live="polite"></div><a class="back" href="/">← Return to Tensie GT</a></main><script>const $=s=>document.querySelector(s);$('#form').onsubmit=async e=>{e.preventDefault();$('#submit').disabled=true;$('#status').textContent='Checking credentials…';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({email:$('#email').value.trim(),password:$('#password').value})});const j=await r.json();if(!r.ok)throw Error(j.error||'Sign in failed.');if(j.user.role!=='admin'){await fetch('/api/auth/logout',{method:'POST'});throw Error('This account does not have administrator access.')}location.href='/admin.html'}catch(err){$('#status').textContent=err.message}finally{$('#submit').disabled=false}};</script></body></html>
