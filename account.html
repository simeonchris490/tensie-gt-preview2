<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0b0c"><title>Customer account | Tensie GT"><style>
:root{--red:#d6001c;--ink:#0b0b0c;--muted:#666}*{box-sizing:border-box}body{margin:0;background:#f2f2ef;color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}.top{background:var(--ink);color:#fff;padding:18px 22px;display:flex;justify-content:space-between;align-items:center}.brand{color:#fff;text-decoration:none;font-weight:900;letter-spacing:.18em}.top a:last-child{color:#fff}.wrap{max-width:480px;margin:7vh auto;padding:0 18px}.card{background:#fff;padding:30px;border:1px solid #ddd;box-shadow:0 18px 50px #0000000d}.eyebrow{color:var(--red);font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}h1{font-size:32px;line-height:1.1;margin:8px 0}p{color:var(--muted)}.tabs{display:flex;gap:8px;margin:24px 0}.tabs button{flex:1;padding:12px;border:1px solid #bbb;background:#fff;font-weight:700}.tabs button.active{background:var(--ink);color:#fff;border-color:var(--ink)}label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}input{width:100%;padding:13px;border:1px solid #bbb;font:inherit;border-radius:2px}button.primary{width:100%;margin-top:20px;padding:14px;background:var(--red);border:0;color:#fff;font-weight:800;letter-spacing:.06em;text-transform:uppercase}button:disabled{opacity:.6}#status{min-height:24px;margin-top:14px;font-size:14px}.foot{text-align:center;font-size:13px;margin:18px;color:#666}.hidden{display:none}
</style></head><body><header class="top"><a class="brand" href="/">TENSIE GT</a><a href="/">Back to website</a></header><main class="wrap"><section class="card"><div class="eyebrow">Customer account</div><h1 id="heading">Welcome back.</h1><p>Sign in to manage your Tensie GT customer account, or create an account to get started.</p><div class="tabs"><button id="loginTab" class="active" type="button">Sign in</button><button id="registerTab" type="button">Create account</button></div><form id="authForm"><div id="nameField" class="hidden"><label for="name">Full name</label><input id="name" autocomplete="name" maxlength="80"></div><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required maxlength="160"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required minlength="10" maxlength="200"><button class="primary" id="submit" type="submit">Sign in</button></form><div id="status" role="status" aria-live="polite"></div><div id="signedIn" class="hidden"><p id="welcome"></p><button class="primary" id="logout" type="button">Sign out</button></div></section><div class="foot">Your customer account is separate from the Tensie GT admin portal.</div></main><script>
const $=s=>document.querySelector(s);let mode='login';function setMode(m){mode=m;$('#loginTab').classList.toggle('active',m==='login');$('#registerTab').classList.toggle('active',m==='register');$('#nameField').classList.toggle('hidden',m!=='register');$('#name').required=m==='register';$('#heading').textContent=m==='login'?'Welcome back.':'Create your account.';$('#submit').textContent=m==='login'?'Sign in':'Create account';$('#password').autocomplete=m==='login'?'current-password':'new-password';$('#status').textContent=''}$('#loginTab').onclick=()=>setMode('login');$('#registerTab').onclick=()=>setMode('register');async function check(){try{const r=await fetch('/api/auth/me');if(!r.ok)return;const j=await r.json();if(j.user.role==='admin')return;$('#authForm').classList.add('hidden');$('.tabs').classList.add('hidden');$('#signedIn').classList.remove('hidden');$('#heading').textContent='You are signed in.';$('#welcome').textContent=`Welcome, ${j.user.name}. You are signed in as ${j.user.email}.`;}catch{}}$('#authForm').onsubmit=async e=>{e.preventDefault();const btn=$('#submit');btn.disabled=true;$('#status').textContent='Please wait…';const body={email:$('#email').value.trim(),password:$('#password').value};if(mode==='register')body.name=$('#name').value.trim();try{const r=await fetch('/api/auth/'+(mode==='login'?'login':'register'),{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw Error(j.error||'Could not complete request.');if(j.user.role==='admin'){location.href='/admin.html';return}$('#authForm').classList.add('hidden');$('.tabs').classList.add('hidden');$('#signedIn').classList.remove('hidden');$('#heading').textContent='You are signed in.';$('#welcome').textContent=`Welcome, ${j.user.name}. Your customer account is ready.`;$('#status').textContent='';}catch(err){$('#status').textContent=err.message}finally{btn.disabled=false}};$('#logout').onclick=async()=>{await fetch('/api/auth/logout',{method:'POST',credentials:'same-origin'});location.reload()};check();
</script></body></html>
