<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0b0c"><title>Admin dashboard | Tensie GT"><style>*{box-sizing:border-box}body{margin:0;background:#f1f1ee;color:#111;font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}.top{background:#0b0b0c;color:#fff;padding:18px 22px;display:flex;justify-content:space-between;align-items:center}.brand{color:#fff;text-decoration:none;font-weight:900;letter-spacing:.18em}.top button{background:#d6001c;border:0;color:#fff;padding:10px 15px;font-weight:700}.wrap{max-width:1000px;margin:40px auto;padding:0 20px}.eyebrow{color:#d6001c;font-size:12px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}h1{font-size:36px;margin:5px 0 24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}.card{background:#fff;border:1px solid #ddd;padding:22px}.label{color:#666;font-size:13px}.number{font-size:38px;font-weight:900;margin-top:8px}#status{margin:20px 0;color:#555}</style></head><body><header class="top"><a class="brand" href="/">TENSIE GT · ADMIN</a><button id="logout">Sign out</button></header><main class="wrap"><div class="eyebrow">Private management</div><h1>Dashboard</h1><p id="welcome">Checking your admin session…</p><div class="grid"><section class="card"><div class="label">Test-drive requests</div><div class="number" id="bookings">—</div></section><section class="card"><div class="label">Customer accounts</div><div class="number" id="customers">—</div></section><section class="card"><div class="label">Email subscribers</div><div class="number" id="subscribers">—</div></section></div><p id="status">These are initial overview totals. More management tools will be added next.</p></main><script>const $=s=>document.querySelector(s);async function init(){try{const me=await fetch('/api/auth/me');if(!me.ok)throw Error('Please sign in.');const m=await me.json();if(m.user.role!=='admin')throw Error('Administrator access required.');$('#welcome').textContent='Signed in as '+m.user.email;const r=await fetch('/api/admin/summary');const j=await r.json();if(!r.ok)throw Error(j.error||'Could not load dashboard.');$('#bookings').textContent=j.bookings;$('#customers').textContent=j.customers;$('#subscribers').textContent=j.subscribers;}catch(e){location.href='/admin-login.html'}}$('#logout').onclick=async()=>{await fetch('/api/auth/logout',{method:'POST'});location.href='/admin-login.html'};init();</script></body></html>
